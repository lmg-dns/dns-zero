<!DOCTYPE html>
<html>
<head>
  <title>DNS Health Checker</title>
  <style>
    body { font-family: Arial; margin: 40px; background: #f5f5f5; }
    .container { max-width: 800px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .subtitle { text-align: center; color: #666; font-size: 14px; margin-bottom: 30px; }
    .input-row { display: flex; justify-content: center; align-items: center; gap: 8px; margin-bottom: 20px; }
    input { width: 320px; padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
    button { padding: 10px 20px; background: #0070f3; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; }
    button:hover { background: #005bb5; }
    .box { border: 1px solid #ccc; border-radius: 6px; padding: 20px; margin-top: 20px; }
    .box h3 { margin-top: 0; color: #003366; }
    .box-1 { background: #f9f9f9; }
    .box-2 { background: #fff8e1; border-color: #f0c040; }
    .pass { color: green; font-weight: bold; }
    .fail { color: red; font-weight: bold; }
    .record-item { margin: 10px 0; padding: 10px; border-radius: 4px; background: #f0f0f0; }
    .copy { cursor: pointer; padding: 4px 10px; margin-top: 6px; background: #0070f3; color: #fff; border: none; border-radius: 4px; font-size: 12px; }
    .copy:hover { background: #005bb5; }
    .contact-box { background: #fff3cd; border: 1px solid #f0c040; border-radius: 6px; padding: 15px; margin-top: 10px; }
    .contact-box a { color: #003366; font-weight: bold; }
    pre { background: #eee; padding: 10px; border-radius: 4px; white-space: pre-wrap; font-size: 13px; }
    .footer { text-align: center; margin-top: 40px; font-size: 12px; color: #aaa; }
    .title { text-align: center; font-size: 24px; font-weight: bold; color: #003366; margin-bottom: 5px; }
  </style>
</head>
<body>
<div class="container">
  <p class="title">DNS Health Checker</p>
  <p class="subtitle">Check if your domain's DNS settings are correctly configured for MyCRM email.<br>You can enter your email address or just your domain.</p>

  <div class="input-row">
    <input id="domain" placeholder="e.g. john@yourbusiness.com.au or yourbusiness.com.au" />
    <button onclick="checkDNS()">Check DNS</button>
  </div>

  <div id="results"></div>
</div>

<div class="footer">
  <p>Powered by MyCRM Technology Support</p>
  <p style="font-size:11px; color:#aaa;">DNS Health Checker &mdash; v1.0.0</p>
</div>

<script>
  const CLOUDFLARE = "https://cloudflare-dns.com/dns-query";

  async function query(domain, type) {
    const res = await fetch(`${CLOUDFLARE}?name=${domain}&type=${type}`, {
      headers: { Accept: "application/dns-json" }
    });
    const data = await res.json();
    return data.Answer || [];
  }

  async function checkDNS() {
    const raw = document.getElementById("domain").value.trim();
    let domain = raw.includes("@") ? raw.split("@")[1].trim() : raw;
    domain = domain.toLowerCase().replace(/^https?:\/\//, "").replace(/\/$/, "").trim();

    if (!domain) { alert("Please enter your email address or domain."); return; }

    document.getElementById("results").innerHTML = "<p style='text-align:center;color:#555;'>Checking DNS records for <strong>" + domain + "</strong>...</p>";

    const [txtRecords, dmarcRecords, mte1, mte2, sg1, sg12, cio] = await Promise.all([
      query(domain, "TXT"),
      query(`_dmarc.${domain}`, "TXT"),
      query(`mte1._domainkey.${domain}`, "CNAME"),
      query(`mte2._domainkey.${domain}`, "CNAME"),
      query(`sg1._domainkey.${domain}`, "CNAME"),
      query(`sg12._domainkey.${domain}`, "CNAME"),
      query(`customerio.${domain}`, "CNAME")
    ]);

    const txt = txtRecords.map(r => r.data.replace(/"/g, "").trim());
    const spfRecord = txt.find(r => r.startsWith("v=spf1"));
    const mandrillRecord = txt.find(r => r.includes("mandrill_verify"));
    const dmarcRecord = dmarcRecords.map(r => r.data.replace(/"/g, "").trim()).find(r => r.includes("v=DMARC1"));

    const spfPass = spfRecord && spfRecord.includes("include:sendgrid.net") && spfRecord.includes("include:spf.mandrillapp.com");
    const mandrillPass = !!mandrillRecord;
    const dmarcPass = !!dmarcRecord;
    const dkimPass = mte1.length > 0 && mte2.length > 0;
    const cioPass = sg1.length > 0 && sg12.length > 0 && cio.length > 0;

    const needsEscalation = !mandrillPass || !cioPass;

    // Box 1
    let box1Content = "";

    if (!spfPass) {
      box1Content += `
        <div class="record-item">
          <strong>SPF Record</strong> &mdash; <span class="fail">Missing or incomplete</span><br>
          <small>Add or update your SPF TXT record. Note: Do NOT create a new one if one already exists — add to it.</small>
          <pre id="spf-val">Type: TXT | Host: @ | Value: v=spf1 include:sendgrid.net include:spf.mandrillapp.com ~all</pre>
          <button class="copy" onclick="copyText('spf-val')">Copy</button>
        </div>`;
    }

    if (!dmarcPass) {
      box1Content += `
        <div class="record-item">
          <strong>DMARC Record</strong> &mdash; <span class="fail">Missing</span><br>
          <small>Add this TXT record to your DNS:</small>
          <pre id="dmarc-val">Type: TXT | Host: _dmarc.${domain} | Value: v=DMARC1; p=none;</pre>
          <button class="copy" onclick="copyText('dmarc-val')">Copy</button>
        </div>`;
    }

    if (!dkimPass) {
      box1Content += `
        <div class="record-item">
          <strong>DKIM Records</strong> &mdash; <span class="fail">Missing</span><br>
          <small>Add these CNAME records to your DNS:</small>
          <pre id="dkim-val">Type: CNAME | Host: mte1._domainkey.${domain} | Value: dkim1.mandrillapp.com
Type: CNAME | Host: mte2._domainkey.${domain} | Value: dkim2.mandrillapp.com</pre>
          <button class="copy" onclick="copyText('dkim-val')">Copy</button>
        </div>`;
    }

    if (spfPass && dmarcPass && dkimPass) {
      box1Content = `<p class='pass'>&#10003; All self-serviceable DNS records are correctly configured!</p>`;
    }

    // Box 2
    let box2Content = "";
    if (needsEscalation) {
      box2Content += `<p>The following settings require assistance from the <strong>MyCRM Technology Support team</strong>:</p><ul>`;
      if (!mandrillPass) box2Content += `<li><strong>Mandrill Verification</strong> &mdash; record not found or needs to be generated</li>`;
      if (!cioPass) box2Content += `<li><strong>CustomerIO / SendGrid CNAME Records</strong> &mdash; missing or incorrect</li>`;
      box2Content += `</ul>
        <div class="contact-box">
          &#128222; <strong>Contact LMG Technology Support</strong><br><br>
          Please raise a support ticket and our team will take care of the rest.<br><br>
          <a href="https://help.loanmarketgroup.com" target="_blank">&#128279; Raise a Support Ticket</a>
        </div>`;
    } else {
      box2Content = `<p class='pass'>&#10003; No escalation needed. All records are in order!</p>`;
    }

    // Badges
    const checks = [
      { label: "SPF", pass: spfPass },
      { label: "Mandrill", pass: mandrillPass },
      { label: "DMARC", pass: dmarcPass },
      { label: "DKIM", pass: dkimPass },
      { label: "SendGrid", pass: cioPass }
    ];

    const badges = checks.map(c =>
      `<span style="display:inline-block;padding:4px 10px;margin:4px;border-radius:12px;font-size:13px;font-weight:bold;background:${c.pass ? '#d4edda' : '#f8d7da'};color:${c.pass ? '#155724' : '#721c24'};">${c.label}: ${c.pass ? '✓' : '✗'}</span>`
    ).join("");

    document.getElementById("results").innerHTML = `
      <div style="text-align:center;margin-bottom:20px;">${badges}</div>
      <div class="box box-1">
        ### &#128196; Box 1 &mdash; DNS Records You Can Fix Yourself
        <p style="color:#555;font-size:13px;">Share these instructions with your IT team or domain provider.</p>
        ${box1Content}
      </div>
      <div class="box box-2">
        ### &#128222; Box 2 &mdash; Needs LMG Support
        <p style="color:#555;font-size:13px;">These settings require access to internal tools and cannot be self-serviced.</p>
        ${box2Content}
      </div>`;
  }

  function copyText(id) {
    const text = document.getElementById(id).innerText;
    navigator.clipboard.writeText(text).then(() => alert("Copied!"));
  }
</script>
</body>
</html>
