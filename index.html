<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>DNS Health Check for MyCRM Emails</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 700px;
      margin: 40px auto;
      padding: 0 20px;
      background: #f9f9f9;
    }
    .header {
      text-align: center;
      margin-bottom: 30px;
    }
    .header h1 {
      font-size: 1.8rem;
      margin-bottom: 8px;
    }
    .header p {
      color: #666;
      font-size: 0.95rem;
      margin: 0;
    }
    .input-row {
      display: flex;
      gap: 10px;
      margin-bottom: 24px;
    }
    .input-row input {
      flex: 1;
      padding: 9px 12px;
      font-size: 1rem;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    .input-row button {
      padding: 9px 18px;
      font-size: 1rem;
      cursor: pointer;
      background: #0078d4;
      color: #fff;
      border: none;
      border-radius: 4px;
    }
    .input-row button:hover { background: #005bb5; }

    .pills {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 24px;
      justify-content: center;
    }
    .pill {
      padding: 4px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: bold;
    }
    .pill-pass { background: #e6f4ea; color: #2e7d32; }
    .pill-fail { background: #fdecea; color: #c62828; }
    .pill-pending { background: #f0f0f0; color: #999; }

    .result-section {
      background: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 16px;
    }
    .result-section.all-good {
      border-color: #81c784;
      background: #f1f8f2;
    }
    .result-section.has-issues {
      border-color: #ef9a9a;
      background: #fff8f8;
    }

    .section-title {
      font-size: 1rem;
      font-weight: bold;
      margin-bottom: 12px;
      color: #333;
    }
    .success-msg {
      color: #2e7d32;
      font-weight: bold;
      font-size: 0.95rem;
    }
    .record-row {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px solid #eee;
    }
    .record-row:last-child { border-bottom: none; }
    .record-label { font-weight: bold; min-width: 80px; font-size: 0.9rem; }
    .status-ok { color: #2e7d32; font-weight: bold; }
    .status-fail { color: #c62828; font-weight: bold; }
    .status-warn { color: #e65100; font-weight: bold; }
    .detail { font-size: 0.82rem; color: #666; margin-top: 3px; }
    .warn-box {
      background: #fff8e1;
      border-left: 4px solid #f5a623;
      padding: 8px 12px;
      margin-top: 8px;
      font-size: 0.83rem;
      border-radius: 0 4px 4px 0;
    }
    .copy-box {
      background: #f4f4f4;
      border: 1px solid #ddd;
      border-radius: 4px;
      padding: 6px 10px;
      font-family: monospace;
      font-size: 0.78rem;
      margin-top: 6px;
      word-break: break-all;
      cursor: pointer;
    }
    .copy-box:hover { background: #e8e8e8; }

    .footer {
      text-align: center;
      margin-top: 40px;
      color: #aaa;
      font-size: 0.82rem;
    }
  </style>
</head>
<body>

<div class="header">
  # DNS Health Check for MyCRM Emails
  <p>Check if your domain's DNS settings are correctly configured for MyCRM email. You can enter your email address or just your domain.</p>
</div>

<div class="input-row">
  <input type="text" id="domainInput" placeholder="e.g. yourdomain.com.au" />
  <button onclick="checkDNS()">Check DNS</button>
</div>

<div id="pills"></div>
<div id="results"></div>

<div class="footer">
  Powered by MyCRM Technology Support<br/>
  <span>DNS Health Checker — v1.0.1</span>
</div>

<script>
  async function fetchDNS(name, type) {
    const url = "https://dns.google/resolve?name=" + encodeURIComponent(name) + "&type=" + type;
    const res = await fetch(url);
    return res.json();
  }

  async function checkDNS() {
    const raw = document.getElementById("domainInput").value.trim().toLowerCase();
    const domain = raw.replace(/^https?:\/\//, "").replace(/\/.*$/, "").split("@").pop();
    if (!domain) { alert("Please enter a domain or email."); return; }

    document.getElementById("pills").innerHTML = "<div class='pills'><span class='pill pill-pending'>Checking...</span></div>";
    document.getElementById("results").innerHTML = "";

    try {
      const [spfData, dkimData, dmarcData, sgData, mandrillData] = await Promise.all([
        fetchDNS(domain, "TXT"),
        fetchDNS("mandrill._domainkey." + domain, "TXT"),
        fetchDNS("_dmarc." + domain, "TXT"),
        fetchDNS("em." + domain, "CNAME"),
        fetchDNS(domain, "TXT")
      ]);

      const allTxt = (spfData.Answer || []).map(r => r.data.replace(/"/g, "").trim());
      const spfRecords = allTxt.filter(r => r.startsWith("v=spf1"));
      const spfCount = spfRecords.length;
      const spfHasMandrill = spfRecords.some(r => r.includes("spf.mandrillapp.com") || r.includes("_spf.mandrillapp.com"));
      const spfHasSendgrid = spfRecords.some(r => r.includes("sendgrid.net"));
      const spfPass = spfCount === 1 && spfHasMandrill && spfHasSendgrid;

      const dkimRecords = (dkimData.Answer || []).map(r => r.data.replace(/"/g, "").trim());
      const dkimPass = dkimRecords.some(r => r.includes("v=DKIM1") || r.includes("p="));

      const dmarcRecords = (dmarcData.Answer || []).map(r => r.data.replace(/"/g, "").trim());
      const dmarcPass = dmarcRecords.some(r => r.startsWith("v=DMARC1"));

      const sgRecords = (sgData.Answer || []).map(r => r.data.trim());
      const sgPass = sgRecords.some(r => r.includes("sendgrid.net"));

      const mandrillRecords = allTxt.filter(r => r.startsWith("mandrill_verify"));
      const mandrillPass = mandrillRecords.length > 0;

      // Pills
      const pillsHTML = `
        <div class="pills">
          <span class="pill ${spfPass ? 'pill-pass' : 'pill-fail'}">SPF: ${spfPass ? '✔' : '✘'}</span>
          <span class="pill ${mandrillPass ? 'pill-pass' : 'pill-fail'}">Mandrill: ${mandrillPass ? '✔' : '✘'}</span>
          <span class="pill ${dmarcPass ? 'pill-pass' : 'pill-fail'}">DMARC: ${dmarcPass ? '✔' : '✘'}</span>
          <span class="pill ${dkimPass ? 'pill-pass' : 'pill-fail'}">DKIM: ${dkimPass ? '✔' : '✘'}</span>
          <span class="pill ${sgPass ? 'pill-pass' : 'pill-fail'}">SendGrid: ${sgPass ? '✔' : '✘'}</span>
        </div>`;
      document.getElementById("pills").innerHTML = pillsHTML;

      // Box 1 — Self-serviceable
      const box1Issues = !spfPass || !dmarcPass;
      let box1HTML = "";
      if (!box1Issues) {
        box1HTML = `
          <div class="result-section all-good">
            <div class="success-msg">✔ All self-serviceable DNS records are correctly configured!</div>
          </div>`;
      } else {
        let issuesHTML = "";

        // SPF
        if (spfCount === 0) {
          issuesHTML += `<div class="record-row">
            <div class="record-label">SPF</div>
            <div>
              <div class="status-fail">✘ No SPF record found</div>
              <div class="warn-box">⚠️ No SPF record found for ${domain}.</div>
            </div>
          </div>`;
        } else if (spfCount > 1) {
          issuesHTML += `<div class="record-row">
            <div class="record-label">SPF</div>
            <div>
              <div class="status-warn">⚠ Multiple SPF records detected</div>
              <div class="warn-box">⚠️ You have ${spfCount} SPF records. Only one is allowed — combine them.</div>
              ${spfRecords.map(r => `<div class="copy-box" onclick="copyText(this)">${r}</div>`).join("")}
            </div>
          </div>`;
        } else {
          let spfIssues = "";
          if (!spfHasMandrill) spfIssues += `<div class="warn-box">⚠️ Mandrill (spf.mandrillapp.com) is missing from your SPF record.</div>`;
          if (!spfHasSendgrid) spfIssues += `<div class="warn-box">⚠️ SendGrid (sendgrid.net) is missing from your SPF record.</div>`;
          if (spfIssues) {
            issuesHTML += `<div class="record-row">
              <div class="record-label">SPF</div>
              <div>
                <div class="status-warn">⚠ SPF record needs updating</div>
                ${spfRecords.map(r => `<div class="copy-box" onclick="copyText(this)">${r}</div>`).join("")}
                ${spfIssues}
              </div>
            </div>`;
          }
        }

        // DMARC
        if (!dmarcPass) {
          issuesHTML += `<div class="record-row">
            <div class="record-label">DMARC</div>
            <div>
              <div class="status-warn">⚠ No DMARC record found</div>
              <div class="warn-box">⚠️ No DMARC record found at _dmarc.${domain}. Add one for better email security.</div>
            </div>
          </div>`;
        }

        box1HTML = `
          <div class="result-section has-issues">
            <div class="section-title">🔧 DNS Records You Can Fix Yourself</div>
            <div class="detail" style="margin-bottom:12px;">Share these instructions with your IT team or domain provider.</div>
            ${issuesHTML}
          </div>`;
      }

      // Box 2 — Needs LMG Support (only show if Mandrill or SendGrid failing)
      const box2Issues = !mandrillPass || !dkimPass || !sgPass;
      let box2HTML = "";
      if (box2Issues) {
        let lmgIssues = "";

        if (!mandrillPass) {
          lmgIssues += `<div class="record-row">
            <div class="record-label">Mandrill</div>
            <div>
              <div class="status-fail">✘ Mandrill verification missing</div>
              <div class="warn-box">⚠️ No Mandrill verification TXT record found. This requires access to Mandrill to generate.</div>
            </div>
          </div>`;
        }

        if (!dkimPass) {
          lmgIssues += `<div class="record-row">
            <div class="record-label">DKIM</div>
            <div>
              <div class="status-fail">✘ Mandrill DKIM missing</div>
              <div class="warn-box">⚠️ No DKIM record found at mandrill._domainkey.${domain}.</div>
            </div>
          </div>`;
        }

        if (!sgPass) {
          lmgIssues += `<div class="record-row">
            <div class="record-label">SendGrid</div>
            <div>
              <div class="status-fail">✘ SendGrid CNAME missing</div>
              <div class="warn-box">⚠️ No SendGrid CNAME found at em.${domain}.</div>
            </div>
          </div>`;
        }

        box2HTML = `
          <div class="result-section has-issues">
            <div class="section-title">📞 Needs LMG Support</div>
            <div class="detail" style="margin-bottom:12px;">These settings require access to internal tools and cannot be self-serviced.</div>
            ${lmgIssues}
          </div>`;
      } else {
        box2HTML = `
          <div class="result-section all-good">
            <div class="success-msg">✔ No escalation needed. All records are in order!</div>
          </div>`;
      }

      document.getElementById("results").innerHTML = box1HTML + box2HTML;

    } catch(e) {
      document.getElementById("pills").innerHTML = "";
      document.getElementById("results").innerHTML = "<p style='color:red'>Error checking DNS. Please try again.</p>";
    }
  }

  function copyText(el) {
    navigator.clipboard.writeText(el.textContent.trim()).then(() => {
      el.style.background = "#d4edda";
      setTimeout(() => { el.style.background = ""; }, 1200);
    });
  }
</script>
</body>
</html>
